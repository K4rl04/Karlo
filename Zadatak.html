<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Look Outside</title>
    <style>
        
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #eeeeee; 
        }

      
        nav {
            background-color: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }


        .header {
            background-color: #ad1a1a;
            color: white;
            padding: 60px 20px;
            text-align: center;
        }

     
        .container {
            width: 80%;
            margin: 20px auto;
        }

        
        .red {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }


        .stupac {
            background-color: white;
            width: 30%; 
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ccc; 
            box-sizing: border-box;
        }


        .slika-okvir {
            background-color: #ddd;
            height: 150px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            color: #666;
        }

        /* Footer */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 20px;
        }

        /* Responzivnost za mobitele (da se ne raspadne) */
        @media (max-width: 768px) {
            .stupac {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="#">Početna</a>
        <a href="#">Trajler</a>
        <a href="#">Kontakt</a>
    </nav>

    <div class="header">
        <h1>Look Outside</h1>
        <p>.</p>
    </div>

    <div class="container">
        <h2>Moje sekcije</h2>
        <div class="red">
            
            <div class="stupac">
                <div class="slika-okvir">Ovdje ide slika 1</div>
                <h3>Podnaslov 1</h3>
                <p>Ovdje napiši tekst o prvoj temi.</p>
            </div>

            <div class="stupac">
                <div class="slika-okvir">Tekst</div>
                <h3>Podnaslov 2</h3>
                <p>Tekst za drugu temu..</p>
            </div>

            <div class="stupac">
                <div class="slika-okvir">Ovdje ide slika 3</div>
                <h3>Podnaslov 3</h3>
                <p>Još malo teksta za kraj ove sekcije.</p>
            </div>

        </div>
    </div>

    <footer>
        <p>Izradio: Karlo Blagus | 2026.</p>
    </footer>

</body>
</html>
